services:
  - type: web
    name: ngo-voice-calling-system
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/seed_ngo_data.py && python scripts/generate_audio.py"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
